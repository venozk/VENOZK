<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0707">
<title>VENOZK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800&family=Barlow:wght@500;600&family=Anton&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0707; --ink:#f6f1ee; --muted:rgba(246,241,238,.62);
  --blood:#c4251f; --blood-hi:#ff5a4d; --deep:#5a0c0c;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{
  min-height:100vh;min-height:100dvh;color:var(--ink);overflow-x:hidden;
  font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  display:flex;justify-content:center;align-items:center;
  padding:max(32px,env(safe-area-inset-top)) 20px max(32px,env(safe-area-inset-bottom));
}

/* Backdrop: slow liquid orbs + halftone texture, so the glass has something to refract */
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.orb{position:absolute;border-radius:50%;filter:blur(70px);will-change:transform}
.o1{width:62vmax;height:62vmax;left:-20vmax;top:-24vmax;background:radial-gradient(circle,var(--blood),transparent 68%);opacity:.75;animation:drift1 22s ease-in-out infinite alternate}
.o2{width:52vmax;height:52vmax;right:-22vmax;bottom:-20vmax;background:radial-gradient(circle,#8d1410,transparent 68%);opacity:.8;animation:drift2 26s ease-in-out infinite alternate}
.o3{width:30vmax;height:30vmax;left:55%;top:8%;background:radial-gradient(circle,rgba(255,255,255,.35),transparent 65%);opacity:.5;animation:drift3 19s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate3d(14vmax,10vmax,0) scale(1.15)}}
@keyframes drift2{to{transform:translate3d(-16vmax,-8vmax,0) scale(1.1)}}
@keyframes drift3{to{transform:translate3d(-22vmax,26vmax,0) scale(.85)}}
#live{position:absolute;inset:0;width:100%;height:100%;
  -webkit-mask-image:radial-gradient(ellipse at 50% 45%,#000 25%,rgba(0,0,0,.4) 100%);mask-image:radial-gradient(ellipse at 50% 45%,#000 25%,rgba(0,0,0,.4) 100%)}

/* Liquid glass */
.glass{
  position:relative;
  background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.04) 45%,rgba(255,255,255,.09));
  -webkit-backdrop-filter:blur(22px) saturate(180%) brightness(1.05);
  backdrop-filter:blur(22px) saturate(180%) brightness(1.05);
  border:1px solid rgba(255,255,255,.16);
  box-shadow:
    inset 0 1.5px 0 rgba(255,255,255,.45),
    inset 0 -1.5px 0 rgba(255,255,255,.08),
    inset 1.5px 0 0 rgba(255,255,255,.12),
    inset 0 0 24px rgba(255,255,255,.05),
    0 24px 60px rgba(0,0,0,.55),
    0 2px 8px rgba(0,0,0,.35);
}

main{position:relative;z-index:1;width:100%;max-width:440px;padding:38px 22px 24px;border-radius:34px;text-align:center}

.avatar-wrap{width:140px;height:140px;margin:0 auto 24px;padding:6px;border-radius:50%}
.avatar{--rx:0deg;--ry:0deg;width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;
  box-shadow:0 0 0 1px rgba(255,255,255,.25),0 10px 30px rgba(196,37,31,.45);
  transform:perspective(500px) rotateX(var(--rx)) rotateY(var(--ry));
  transition:transform .25s ease-out;
  animation:breathe 4.5s ease-in-out infinite}
@keyframes breathe{
  0%,100%{scale:1;box-shadow:0 0 0 1px rgba(255,255,255,.25),0 10px 30px rgba(196,37,31,.4)}
  50%{scale:1.035;box-shadow:0 0 0 1px rgba(255,255,255,.35),0 12px 52px rgba(255,74,61,.75)}
}
/* light that circles the avatar */
.avatar-wrap::after{
  content:"";position:absolute;inset:-6px;border-radius:50%;padding:3px;pointer-events:none;
  background:conic-gradient(rgba(255,90,77,0) 0%,rgba(255,90,77,0) 45%,#ff5a4d 75%,#fff 92%,rgba(255,90,77,0) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask-composite:exclude;
  animation:spin 5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

h1{
  display:flex;justify-content:center;
  font-family:'Cinzel',Georgia,'Times New Roman',serif;font-weight:800;
  font-size:clamp(2.1rem,9vw,2.7rem);letter-spacing:.08em;line-height:1.1;
}
h1 .l{
  display:inline-block;
  background:linear-gradient(180deg,#fff 10%,#a49b98 58%,#e4dcd8 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 rgba(0,0,0,.55));
}

.links{list-style:none;padding:0;margin-top:34px;display:grid;gap:12px}
.link{
  --x:50%;--y:50%;--glow:0;
  display:flex;align-items:center;gap:14px;text-align:left;
  padding:12px 16px 12px 12px;border-radius:22px;color:var(--ink);text-decoration:none;overflow:hidden;
  transition:transform .35s var(--ease),border-color .35s,box-shadow .35s;
}
/* specular light that follows the pointer */
.link::before{
  content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:radial-gradient(180px circle at var(--x) var(--y),rgba(255,255,255,.30),transparent 65%);
  opacity:var(--glow);transition:opacity .3s;
}
.link:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.3)}
.link:active{transform:translateY(0) scale(.985)}
.link:focus-visible{outline:2px solid var(--blood-hi);outline-offset:3px}
.ico{
  position:relative;flex:none;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;
  background:linear-gradient(160deg,rgba(255,90,77,.55),rgba(140,18,14,.55));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -6px 12px rgba(0,0,0,.25),0 6px 14px rgba(196,37,31,.3);
}
.ico svg{width:23px;height:23px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.txt{position:relative;flex:1;min-width:0}
.txt b{display:block;font-weight:600;font-size:1.05rem;letter-spacing:.01em}
.txt small{display:block;margin-top:1px;color:var(--muted);font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{position:relative;width:18px;height:18px;flex:none;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .35s var(--ease),stroke .3s}
.link:hover .chev{transform:translateX(4px);stroke:#fff}

footer{margin-top:26px;font-size:.8rem;color:rgba(246,241,238,.4);letter-spacing:.04em}

/* Load sequence: one orchestrated reveal */
.in{animation:in .9s var(--ease) backwards;animation-delay:calc(var(--d,0) * 1ms)}
@keyframes in{from{opacity:0;transform:translateY(18px) scale(.97);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
h1 .l{animation:letter .8s var(--ease) backwards,glint 6s ease-in-out infinite;animation-delay:calc(700ms + var(--i) * 70ms),calc(2600ms + var(--i) * 140ms)}
@keyframes glint{0%,14%,100%{filter:drop-shadow(0 2px 0 rgba(0,0,0,.55))}7%{filter:drop-shadow(0 2px 0 rgba(0,0,0,.55)) drop-shadow(0 0 14px rgba(255,90,77,.95)) brightness(1.35)}}

/* Idle life: buttons float, icons react, background parallaxes */
.links li.in{animation:in .9s var(--ease) backwards,float 6s ease-in-out infinite;animation-delay:calc(var(--d,0) * 1ms),calc(var(--d,0) * 1ms + 1000ms)}
@keyframes float{50%{translate:0 -4px}}
.ico{transition:transform .35s var(--ease)}
.link:hover .ico{transform:rotate(-8deg) scale(1.1)}
.orb{transition:translate .9s ease-out}
.o1{translate:calc(var(--px,0) * -50px) calc(var(--py,0) * -50px)}
.o2{translate:calc(var(--px,0) * 60px) calc(var(--py,0) * 60px)}
.o3{translate:calc(var(--px,0) * -30px) calc(var(--py,0) * 40px)}
@keyframes letter{from{opacity:0;transform:translateY(.4em);filter:blur(10px)}to{opacity:1;transform:none}}

/* Cat memes */
.memes{margin-top:22px;border-radius:26px;padding:8px 8px 0;overflow:hidden}
.stage{position:relative;aspect-ratio:16/10;border-radius:18px;overflow:hidden;cursor:pointer;background:linear-gradient(160deg,#4a0f0e,#140909);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.scene{display:none;position:absolute;inset:0;width:100%;height:100%}
.scene.on{display:block;animation:sc .5s var(--ease)}
@keyframes sc{from{opacity:0;transform:scale(1.05)}}
.mt{font-family:'Anton',Impact,'Arial Narrow',sans-serif;font-size:24px;fill:#fff;stroke:#000;stroke-width:5px;paint-order:stroke;stroke-linejoin:round;text-anchor:middle;letter-spacing:.5px}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
.pup{transform:translate(var(--ex,0px),var(--ey,0px));transition:transform .15s}
.tail{transform-origin:205px 170px;animation:wag 1.1s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-10deg)}to{transform:rotate(18deg)}}
.paw{animation:swat 4s ease-in-out infinite}
@keyframes swat{0%,35%{transform:translateX(0)}42%{transform:translateX(-12px)}50%{transform:translateX(16px)}62%,100%{transform:translateX(0)}}
.cup{transform-box:fill-box;transform-origin:center;animation:cup 4s ease-in infinite}
@keyframes cup{0%,49%{transform:none;opacity:1}75%{transform:translate(50px,90px) rotate(150deg);opacity:1}80%{transform:translate(55px,110px) rotate(170deg);opacity:0}81%,92%{transform:none;opacity:0}100%{transform:none;opacity:1}}
.zz{font:400 20px 'Anton',Impact,sans-serif;fill:#fff;opacity:0;animation:zz 3s ease-out infinite}
@keyframes zz{0%{opacity:0;transform:translate(0,0) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translate(20px,-36px) scale(1.2)}}
.bar{transform-box:fill-box;transform-origin:left center;animation:load 5s ease-in-out infinite}
@keyframes load{0%{transform:scaleX(0)}60%,100%{transform:scaleX(.99)}}
.dn{display:flex;justify-content:center;gap:8px;padding:12px 0}
.dn button{width:8px;height:8px;border-radius:4px;border:0;padding:0;background:rgba(255,255,255,.3);cursor:pointer;transition:width .3s var(--ease),background .3s}
.dn button[aria-current=true]{width:22px;background:#ff5a4d}
.dn button:focus-visible{outline:2px solid var(--blood-hi);outline-offset:3px}


/* ===== Viewer-safe animation + brand lockup ===== */
.links li.in{animation:in .9s var(--ease) backwards}
.link{animation:bob 6s ease-in-out infinite}
.links li:nth-child(2) .link{animation-delay:.8s}.links li:nth-child(3) .link{animation-delay:1.6s}
@keyframes bob{0%,100%{top:0}50%{top:-4px}}
.avatar{animation:glowpulse 4.5s ease-in-out infinite}
@keyframes glowpulse{0%,100%{box-shadow:0 0 0 1px rgba(255,255,255,.25),0 10px 30px rgba(196,37,31,.4)}50%{box-shadow:0 0 0 1px rgba(255,255,255,.35),0 12px 52px rgba(255,74,61,.75)}}
.brand{margin-bottom:-4px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:5px 13px;border-radius:99px;font-size:.8rem;letter-spacing:.04em;color:var(--muted);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);margin-bottom:16px}
.dot{width:7px;height:7px;border-radius:50%;background:#ff5a4d;animation:ping 1.8s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,90,77,.75)}100%{box-shadow:0 0 0 9px rgba(255,90,77,0)}}
.brand h1{position:relative;isolation:isolate;letter-spacing:.2em;padding-left:.2em;font-size:clamp(2.3rem,11vw,3.2rem)}
.brand h1::before{content:"";position:absolute;left:50%;top:50%;width:80%;height:80%;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(255,74,61,.55),transparent);filter:blur(18px);z-index:-1;animation:aura 3.2s ease-in-out infinite alternate}
@keyframes aura{from{opacity:.3}to{opacity:.9}}
.brand h1 .l{
  background:linear-gradient(100deg,#8f8683 0%,#e9e2de 38%,#fff 46%,#ff6a5c 52%,#fff 58%,#a49b98 70%,#8f8683 100%);
  background-size:300% 100%;background-position:100% 0;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;filter:none;
  transition:transform .3s var(--ease);
  animation:letter .8s var(--ease) backwards,shine 4.5s linear infinite}
.brand h1 .l:hover{transform:translateY(-5px)}
@keyframes shine{0%{background-position:100% 0}60%,100%{background-position:0% 0}}
.rule{position:relative;width:min(220px,60%);height:1px;margin:16px auto 12px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:draw 1.1s var(--ease) 1.1s backwards}
@keyframes draw{from{transform:scaleX(0);opacity:0}}
.rule::after{content:"";position:absolute;top:-1px;left:0;width:44px;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,#ff8a7d,transparent);animation:travel 3s ease-in-out infinite}
@keyframes travel{0%{left:-20%}100%{left:100%}}
.rule i{position:absolute;left:50%;top:-3px;width:7px;height:7px;margin-left:-3px;transform:rotate(45deg);background:#ff5a4d;animation:dia 2s ease-in-out infinite}
@keyframes dia{0%,100%{box-shadow:0 0 6px #ff5a4d}50%{box-shadow:0 0 18px 3px #ff5a4d}}
.handle{font-size:.95rem;letter-spacing:.14em;color:var(--muted)}
</style>
</head>

<script>
document.querySelectorAll('.link').forEach(function(el){
  el.addEventListener('pointermove',function(e){
    var r=el.getBoundingClientRect();
    el.style.setProperty('--x',(e.clientX-r.left)+'px');
    el.style.setProperty('--y',(e.clientY-r.top)+'px');
    el.style.setProperty('--glow','1');
  });
  el.addEventListener('pointerleave',function(){el.style.setProperty('--glow','0')});
});

/* Meme carousel: tap to advance; each scene restarts its animation when shown */
(function(){
  var sc=document.querySelectorAll('.scene'),dt=document.querySelectorAll('.dn button'),i=0,tm;
  function show(n){
    i=(n+sc.length)%sc.length;
    sc.forEach(function(s,k){var on=k===i;s.classList.toggle('on',on);if(on){try{s.setCurrentTime(0)}catch(e){}}});
    dt.forEach(function(b,k){b.setAttribute('aria-current',k===i)});
  }
  function auto(){clearInterval(tm);tm=setInterval(function(){show(i+1)},5000)}
  document.querySelector('.stage').addEventListener('click',function(){show(i+1);auto()});
  dt.forEach(function(b,k){b.addEventListener('click',function(){show(k);auto()})});
  show(0);auto();
})();

/* Profile picture tilts toward the pointer */
(function(){
  var a=document.querySelector('.avatar');
  if(false)return;
  window.addEventListener('pointermove',function(e){
    var nx=e.clientX/window.innerWidth-.5,ny=e.clientY/window.innerHeight-.5;
    a.style.setProperty('--ry',(nx*18).toFixed(1)+'deg');
    a.style.setProperty('--rx',(-ny*18).toFixed(1)+'deg');
  });
  document.documentElement.addEventListener('pointerleave',function(){
    a.style.setProperty('--rx','0deg');a.style.setProperty('--ry','0deg');
  });
})();

/* Live background: ripple-reactive halftone grid + rising embers */
(function(){
  var c=document.getElementById('live'),x=c.getContext('2d');
  var dpr=Math.min(window.devicePixelRatio||1,2),W,H,S,cols,rows,em=[],rip=[],last=0;
  var m={x:-9999,y:-9999,tx:-9999,ty:-9999};
  var still=false;
  var root=document.documentElement;
  function spawn(init){return{x:Math.random()*W,y:init?Math.random()*H:H+10,r:Math.random()*1.6+.7,s:Math.random()*26+14,w:Math.random()*6.28,a:Math.random()*.5+.35}}
  function size(){
    W=window.innerWidth;H=window.innerHeight;
    c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);
    S=W<600?16:20;cols=Math.ceil(W/S)+1;rows=Math.ceil(H/S)+1;
    em=[];for(var n=Math.round(W*H/20000);n>0;n--)em.push(spawn(true));
    if(still)draw(0,0);
  }
  function draw(t,dt){
    x.clearRect(0,0,W,H);
    for(var k=rip.length-1;k>=0;k--)if(t-rip[k].t>1.8)rip.splice(k,1);
    for(var j=0;j<rows;j++){
      for(var i=0;i<cols;i++){
        var px=i*S,py=j*S;
        var v=Math.sin(i*.22+t*.9)+Math.sin(j*.26-t*.7)+Math.sin((i+j)*.14+t*.5)+Math.sin(Math.hypot(i-cols/2,j-rows/2)*.28-t*1.1);
        v=(v+4)/8;
        var dx=px-m.x,dy=py-m.y,d=Math.sqrt(dx*dx+dy*dy),p=Math.max(0,1-d/220);
        if(p>0&&d>0){var kk=p*p*14;px+=dx/d*kk;py+=dy/d*kk}
        var q=0;
        for(var n=0;n<rip.length;n++){
          var age=t-rip[n].t,rx=px-rip[n].x,ry=py-rip[n].y;
          q+=Math.max(0,1-Math.abs(Math.sqrt(rx*rx+ry*ry)-age*420)/70)*(1-age/1.8);
        }
        x.globalAlpha=Math.min(1,.12+v*.5+p*.4+q*.6);
        x.fillStyle=(v+p+q>.75)?'#ff4a3d':'#f6f1ee';
        x.beginPath();x.arc(px,py,.6+v*v*3.2+p*p*4.5+q*5,0,6.2832);x.fill();
      }
    }
    /* embers drift upward, sway, and shy away from the pointer */
    x.globalCompositeOperation='lighter';x.fillStyle='#ff5a4d';
    for(var e=0;e<em.length;e++){
      var o=em[e];
      o.y-=o.s*dt;o.x+=Math.sin(t*.8+o.w)*12*dt;
      var ex=o.x-m.x,ey=o.y-m.y,ed=Math.sqrt(ex*ex+ey*ey);
      if(ed<150&&ed>0){o.x+=ex/ed*(150-ed)*dt*3;o.y+=ey/ed*(150-ed)*dt*3}
      if(o.y<-10)em[e]=o=spawn(false);
      var tw=o.a*(.65+.35*Math.sin(t*3+o.w));
      x.globalAlpha=tw*.22;x.beginPath();x.arc(o.x,o.y,o.r*3.2,0,6.2832);x.fill();
      x.globalAlpha=tw;x.beginPath();x.arc(o.x,o.y,o.r,0,6.2832);x.fill();
    }
    x.globalCompositeOperation='source-over';x.globalAlpha=1;
  }
  function frame(ms){
    var t=ms*.001,dt=Math.min(.05,t-last);last=t;
    m.x+=(m.tx-m.x)*.12;m.y+=(m.ty-m.y)*.12;
    draw(t,dt);
    requestAnimationFrame(frame);
  }
  window.addEventListener('resize',size);
  window.addEventListener('pointermove',function(e){
    m.tx=e.clientX;m.ty=e.clientY;
    if(!still){root.style.setProperty('--px',(e.clientX/W-.5).toFixed(3));root.style.setProperty('--py',(e.clientY/H-.5).toFixed(3))}
  });
  window.addEventListener('pointerdown',function(e){if(!still)rip.push({x:e.clientX,y:e.clientY,t:performance.now()*.001})});
  root.addEventListener('pointerleave',function(){m.tx=m.ty=-9999});
  size();
  if(!still)requestAnimationFrame(function(ms){last=ms*.001;frame(ms)});
})();
</script>
</body>
