<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>VENOZK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Barlow:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#f4ece2;--muted:rgba(244,236,226,.64);--ember:#ffc98a;--line:rgba(255,236,214,.2);--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box;margin:0}
html{background:#000;height:100%}
body{
  min-height:100vh;min-height:100dvh;color:var(--ink);overflow-x:hidden;overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  display:flex;justify-content:center;align-items:flex-end;
  padding:16px 16px max(20px,env(safe-area-inset-bottom));
}

/* ---------- Video stage: seamless baked loop, compositor-only motion ---------- */
.stage{position:fixed;inset:0;z-index:0;overflow:hidden;background:#000;pointer-events:none;contain:strict}
.stage video{position:absolute;left:-4%;top:-4%;width:108%;height:108%;object-fit:cover;object-position:38% 22%;
  transform:translate3d(0,0,0);backface-visibility:hidden;background:#000}
/* scrim keeps text readable over the bright disk; warm cast ties it to the card */
.scrim{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(to top,rgba(4,3,3,.9) 0,rgba(4,3,3,.5) 36%,rgba(4,3,3,0) 68%),
             radial-gradient(120% 80% at 30% 18%,rgba(255,160,80,.10),transparent 60%),
             radial-gradient(140% 100% at 50% 40%,transparent 55%,rgba(0,0,0,.55))}
.grain{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.07;background-size:96px 96px}

/* ---------- Event-horizon card: solid, hairline, no blur ---------- */
.card{position:relative;z-index:3;width:100%;max-width:380px;margin-top:56px;padding:58px 14px 12px;text-align:center;
  background:rgba(8,6,5,.74);border:1px solid var(--line);border-radius:22px;
  box-shadow:0 30px 70px rgba(0,0,0,.6)}
/* ember hairline on the top edge, with a slow light passing along it */
.card::before{content:"";position:absolute;left:22px;right:22px;top:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--ember),transparent);opacity:.75}
.card::after{content:"";position:absolute;left:22px;top:-1px;width:70px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#fff,transparent);
  animation:pass 5s ease-in-out infinite;will-change:transform}
@keyframes pass{from{transform:translate3d(0,0,0);opacity:0}15%,85%{opacity:.9}to{transform:translate3d(246px,0,0);opacity:0}}

.avatar-wrap{position:absolute;left:50%;top:-48px;width:96px;height:96px;margin-left:-48px;padding:4px;border-radius:50%;background:#0a0807;border:1px solid var(--line)}
.avatar{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;box-shadow:0 0 0 1px rgba(255,255,255,.18),0 10px 30px rgba(255,170,90,.22)}
/* photon ring with one orbiting light */
.orbit{position:absolute;inset:-9px;border-radius:50%;border:1px solid rgba(255,225,190,.26);animation:spin 9s linear infinite;will-change:transform}
.orbit::before{content:"";position:absolute;left:50%;top:-3px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--ember);box-shadow:0 0 10px 2px rgba(255,190,120,.8)}
@keyframes spin{to{transform:rotate(360deg)}}

h1{font-family:'Syncopate','Arial Narrow',system-ui,sans-serif;font-weight:700;font-size:clamp(1.25rem,6vw,1.6rem);letter-spacing:.3em;padding-left:.3em;line-height:1.2;
  color:var(--ink);text-shadow:0 0 26px rgba(255,190,120,.4)}
.handle{margin-top:6px;font-size:.82rem;letter-spacing:.16em;color:var(--muted)}

.links{list-style:none;padding:0;margin-top:16px;display:grid;gap:8px}
.link{display:flex;align-items:center;gap:12px;text-align:left;padding:8px 12px 8px 8px;border-radius:15px;color:var(--ink);text-decoration:none;
  background:rgba(255,240,225,.045);border:1px solid var(--line);transition:background-color .25s,color .25s,border-color .25s,transform .3s var(--ease)}
.link:active{background:var(--ink);color:#0b0907;border-color:var(--ink);transform:scale(.985)}
.link:focus-visible{outline:2px solid var(--ember);outline-offset:3px}
.ico{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);transition:border-color .25s}
.ico svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.txt{flex:1;min-width:0}
.txt b{display:block;font-weight:600;font-size:.98rem}
.txt small{display:block;margin-top:1px;color:var(--muted);font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .25s}
.chev{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.6;transition:transform .3s var(--ease),opacity .25s}
.link:active .txt small{color:rgba(11,9,7,.62)}.link:active .ico{border-color:rgba(11,9,7,.3)}
@media (hover:hover){
  .link:hover{background:var(--ink);color:#0b0907;border-color:var(--ink);transform:translate3d(0,-2px,0)}
  .link:hover .txt small{color:rgba(11,9,7,.62)}.link:hover .ico{border-color:rgba(11,9,7,.3)}
  .link:hover .chev{transform:translate3d(4px,0,0);opacity:1}
}
footer{margin-top:12px;font-size:.7rem;color:rgba(244,236,226,.4);letter-spacing:.06em}

/* one entrance: opacity + transform only */
.in{animation:in .9s var(--ease) both;animation-delay:calc(var(--d,0) * 1ms)}
@keyframes in{from{opacity:0;transform:translate3d(0,16px,0)}}

@media (min-width:700px){body{padding-bottom:max(36px,env(safe-area-inset-bottom))}.stage video{object-position:50% 18%}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .card::after{display:none}
}
</style>
</head>

<script>
(function(){
  "use strict";
  var v=document.getElementById('bg'),reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;

  /* static film grain (generated once, never animated = no flicker) */
  try{var g=document.createElement('canvas');g.width=g.height=96;var x=g.getContext('2d'),im=x.createImageData(96,96),i,n;
    for(i=0;i<im.data.length;i+=4){n=Math.random()*255;im.data[i]=im.data[i+1]=im.data[i+2]=n;im.data[i+3]=255}
    x.putImageData(im,0,0);document.getElementById('grain').style.backgroundImage='url('+g.toDataURL()+')'}catch(e){}

  /* video: fade in once frames are really playing; retry politely if autoplay is blocked */
  function show(){v.classList.add('on')}
  if(v.readyState>=3)show();
  v.addEventListener('playing',show);v.addEventListener('loadeddata',show);
  v.addEventListener('error',show);                      /* poster stays visible if the file is missing */
  if(reduce){v.removeAttribute('autoplay');v.pause();show()}
  else{
    var tryPlay=function(){var p=v.play();if(p&&p.catch)p.catch(function(){})};
    tryPlay();
    ['pointerdown','touchstart','keydown'].forEach(function(ev){addEventListener(ev,function once(){tryPlay();removeEventListener(ev,once)},{passive:true})});
    document.addEventListener('visibilitychange',function(){document.hidden?v.pause():tryPlay()});
  }

  /* gentle pointer parallax: eased, compositor-only, stops its own loop when settled */
  if(!reduce&&matchMedia('(pointer:fine)').matches){
    var tx=0,ty=0,cx=0,cy=0,raf=0;
    function step(){raf=0;cx+=(tx-cx)*.07;cy+=(ty-cy)*.07;
      v.style.transform='translate3d('+cx.toFixed(2)+'px,'+cy.toFixed(2)+'px,0)';
      if(Math.abs(tx-cx)>.05||Math.abs(ty-cy)>.05)raf=requestAnimationFrame(step)}
    addEventListener('pointermove',function(e){tx=(e.clientX/innerWidth-.5)*-18;ty=(e.clientY/innerHeight-.5)*-18;if(!raf)raf=requestAnimationFrame(step)},{passive:true});
  }
})();
</script>
